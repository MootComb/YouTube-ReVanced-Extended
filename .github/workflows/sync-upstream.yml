name: Sync from MANCrimSon to MootComb (keep our files)

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add MANCrimSon as upstream
        run: |
          git remote add upstream https://github.com/MANCrimSon/YouTube-ReVanced-Extended.git
          git fetch upstream
      
      - name: Merge from MANCrimSon (keep our files on conflicts)
        run: |
          echo "🔄 Syncing from MANCrimSon to MootComb..."
          
          # Try to merge
          if git merge --no-commit --no-ff upstream/main; then
            echo "✅ Merge successful, no conflicts"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          else
            echo "⚠️ Conflicts detected! Keeping OUR files (MootComb)..."
            
            # Get conflicted files
            CONFLICT_FILES=$(git diff --name-only --diff-filter=U)
            
            if [ -z "$CONFLICT_FILES" ]; then
              echo "❌ No conflicted files found, but merge failed"
              git merge --abort
              echo "HAS_CHANGES=false" >> $GITHUB_ENV
              exit 0
            fi
            
            # For each conflicted file, take OUR version
            for file in $CONFLICT_FILES; do
              echo "  🛡️ Keeping our file: $file"
              git checkout --ours "$file" 2>/dev/null || true
              git add "$file"
            done
            
            echo "✅ Conflicts resolved in favor of our files"
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi
      
      - name: Commit and push changes
        if: env.HAS_CHANGES == 'true'
        run: |
          # Check if there are changes to commit
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Sync: merged from MANCrimSon (kept our files) $(date -u '+%Y-%m-%d %H:%M:%S')"
            git push origin main
            echo "✅ Changes pushed to MootComb!"
          fi
